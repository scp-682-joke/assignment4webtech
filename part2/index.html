<html>
    <head>
        <meta charset="utf-8">
        <title></title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <nav class="site-header">
            <ul class="navigation-bar">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../part1/index.html">Part 1</a></li>
                <li><a href="index.html" aria-current="page">Part 2</a></li>
                <li><a href="../part3/index.html" >Part 3</a></li>
            </ul>
        </nav>
        <main class="content">
            <h1>Bootstrap form</h1>
        <form class="bootstrap-form" id="form2" action="#" method="post">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control is-valid" id="name" name="name" placeholder="Your full name">
                <div class="valid-feedback">Nice name!</div>
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control is-invalid" id="email" name="email" placeholder="name@example.com" aria-describedby="emailHelp">
              <div class="invalid-feedback">Please enter a valid email address.</div>
              <div id="emailHelp" class="form-text">We will never share your email.</div>
            </div>

            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone (optional)</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 701 123 45 67">
            </div>

            <div class="col-12 col-md-6">
              <label for="subject" class="form-label">Subject</label>
              <select class="form-select" id="subject" name="subject">
                <option selected>Question</option>
                <option>Feedback</option>
                <option>Problem</option>
                <option>Other</option>
              </select>
            </div>

            <div class="col-12">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control is-invalid" id="message" name="message" rows="5" placeholder="Write your message here" aria-describedby="msgHelp"></textarea>
              <div class="invalid-feedback">Please write at least 10 characters.</div>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary">Send</button>
              <button type="reset" class="btn btn-outline-secondary">Clear</button>
            </div>
          </div>
        </form>
    </main>
        <footer class="site-footer"><p>Zhibek Slambek | SE-2530</p></footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src=""></script>
    </body>
</html>
